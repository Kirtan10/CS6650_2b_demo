# Local observability stack: Product API + Prometheus + Grafana.
# Run from this folder:  docker compose up --build
#   API:        http://localhost:8080
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (opens straight into the dashboard, no login)
services:
  product-service:
    build: ../src
    ports:
      - "8080:8080"
    environment:
      - SEED_PRODUCTS=1000
      - ENABLE_FAULT_INJECTION=true   # local only: lets us trigger a 500 on demand

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - product-service

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/product-api-red.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
